name: Release Study Buddy AI (Web, Android, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g., v2.4.0)'
        required: false
        default: 'v2.4.0'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Build Web Application & Static Dist
  # =========================================================================
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Build
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 5

  # =========================================================================
  # 2. Package Android (Capacitor APK + AAB)
  # =========================================================================
  build-android:
    name: Build Android APK & AAB
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Decode Android Keystore (if present in Secrets)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Android Release APK & Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign APK (if keystore provided)
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out study-buddy-ai-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk || true

      - name: Prepare Android Artifacts
        run: |
          mkdir -p release-android
          # Copy APK (signed if generated, or release/debug)
          if [ -f study-buddy-ai-signed.apk ]; then
            cp study-buddy-ai-signed.apk release-android/study-buddy-ai.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-android/study-buddy-ai.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-android/study-buddy-ai.apk
          fi

          # Copy AAB if available
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-android/study-buddy-ai.aab
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-android/
          retention-days: 5

  # =========================================================================
  # 3. Package Windows (Electron / NSIS 64-bit Installer + Portable)
  # =========================================================================
  build-windows:
    name: Build Windows App (.exe)
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Windows Executable & Installer
        run: npx electron-builder --win nsis portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Artifacts
        shell: bash
        run: |
          mkdir -p release-windows
          cp dist-electron/*.exe release-windows/study-buddy-ai-setup.exe || true
          cp dist-electron/*portable*.exe release-windows/study-buddy-ai-portable.exe || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-windows/
          retention-days: 5

  # =========================================================================
  # 4. Create GitHub Release & Publish Checksums
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
