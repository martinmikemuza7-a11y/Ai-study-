steps:
  # 1. Build Docker container image for Cloud Run
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/study-buddy-ai:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/study-buddy-ai:latest', '.']

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/study-buddy-ai:$COMMIT_SHA']

images:
  - 'gcr.io/$PROJECT_ID/study-buddy-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/study-buddy-ai:latest'
